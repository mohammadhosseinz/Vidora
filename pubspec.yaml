name: local_video
description: Vidora local desktop video downloader
publish_to: none
version: 0.2.0+12
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  # Retain the Swift plugin supported by the standalone macOS build.
  path_provider_foundation: 2.4.2
  # This desktop app does not need the newer JNI-based Android backend.
  path_provider_android: 2.2.19
  shared_preferences: ^2.3.3
  window_manager: ^0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/brand/vidora-logo.png
    - assets/support.json
  fonts:
    - family: NotoArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
    - family: NotoChinese
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
